name: Build Maya APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK Platform 34
      run: |
        yes | sdkmanager "platforms;android-34"
        yes | sdkmanager "build-tools;34.0.0"

    # No cache — fresh build every time to avoid stale AGP version issues

    - name: Create local.properties
      run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

    - name: Download Gradle wrapper
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.2/gradle/wrapper/gradle-wrapper.jar
        fi

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build.log

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: /tmp/build.log
        retention-days: 7

    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: maya-debug-apk
        path: app/build/outputs/apk/**/*.apk
        retention-days: 30
